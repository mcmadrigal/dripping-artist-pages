<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dripping 2026 — Artist Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;1,300&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F0EBE1;
  --white: #FAF7F2;
  --black: #2C2520;
  --ink: #3A322C;
  --muted: #8C847D;
  --soft: #D9D2C8;
  --accent: #C8FF00;
  --rule: rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--cream); color: var(--ink); font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.6; }

.site-header { background: var(--black); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.header-right { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); }

.container { max-width: 900px; margin: 0 auto; padding: 32px 24px 64px; }

.page-title { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; }

.day-group { margin-bottom: 40px; }
.day-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--black); background: var(--accent); display: inline-block; padding: 4px 10px; margin-bottom: 12px; }

.artist-card {
  background: var(--white);
  border: 1px solid var(--rule);
  margin-bottom: 6px;
  display: flex;
  align-items: stretch;
  transition: border-color 0.15s;
}
.artist-card:hover { border-color: var(--black); }
.card-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 12px 16px;
  text-decoration: none;
  color: inherit;
}
.card-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.card-actions {
  display: flex;
  flex-direction: column;
  border-left: 1px solid var(--rule);
  flex-shrink: 0;
}
.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-decoration: none;
  color: var(--muted);
  border-bottom: 1px solid var(--rule);
  white-space: nowrap;
  transition: background 0.12s, color 0.12s;
}
.action-btn:last-child { border-bottom: none; }
.action-btn:hover { background: var(--cream); color: var(--ink); }
.action-btn.print:hover { background: var(--black); color: var(--accent); }

.card-name { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 400; color: var(--ink); flex-shrink: 0; }
.card-set { font-size: 12px; color: var(--muted); }
.card-set strong { color: var(--ink); font-weight: 400; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.card-tag { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; background: var(--cream); border: 1px solid var(--soft); padding: 2px 8px; color: var(--muted); white-space: nowrap; }
.card-tag.hotel { background: #EAF2E8; border-color: #B8D9B3; color: #3A6B35; }
.card-tag.cabin { background: #F2EDE0; border-color: #D4C9A8; color: #6B5D35; }
.card-tag.blank { background: rgba(255,100,100,0.08); border-color: rgba(255,100,100,0.25); color: #c06060; }

.sheet-link { font-size: 11px; letter-spacing: 0.06em; color: var(--accent); text-decoration: none; padding: 5px 12px; border: 1px solid rgba(255,255,255,0.15); }
.sheet-link:hover { background: rgba(255,255,255,0.08); }

.no-set { opacity: 0.45; }
.card-notes { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--rule); width: 100%; line-height: 1.5; }

.loading { padding: 48px 0; text-align: center; color: var(--muted); font-style: italic; }
.stats { font-size: 11px; color: var(--muted); margin-bottom: 24px; font-style: italic; }

.search-bar { width: 100%; background: var(--white); border: 1px solid var(--rule); font-family: 'DM Mono', monospace; font-size: 13px; padding: 10px 14px; color: var(--ink); margin-bottom: 24px; outline: none; }
.search-bar:focus { border-color: var(--black); }
.search-bar::placeholder { color: var(--muted); }
</style>
</head>

<div class="container">
  <div class="page-title">Artist Roster · Dripping 2026</div>
  <input class="search-bar" type="text" placeholder="Search artists…" id="search" oninput="filterCards()">
  <div class="stats" id="stats"></div>
  <div id="roster"><div class="loading">Loading artists…</div></div>
</div>

<script>
const DAY_ORDER = { 'Thursday': 0, 'Friday': 1, 'Saturday': 2, 'Sunday': 3, '' : 4 };

function parseTime(t) {
  if (!t) return 9999;
  const m = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return 9999;
  let h = parseInt(m[1]), mn = parseInt(m[2]);
  if (m[3].toUpperCase() === 'PM' && h !== 12) h += 12;
  if (m[3].toUpperCase() === 'AM' && h === 12) h = 0;
  return h * 60 + mn;
}

function lodgingTag(d) {
  if (d.lodging === 'hotel') return `<span class="card-tag hotel">Hotel${d.hotelRoom ? ' · ' + d.hotelRoom : ''}</span>`;
  if (d.lodging === 'cabin') return `<span class="card-tag cabin">Cabin${d.cabin ? ' · ' + d.cabin : ''}</span>`;
  return '';
}

let allArtists = [];

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.artist-card').forEach(card => {
    card.style.display = card.dataset.name.toLowerCase().includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.day-group').forEach(group => {
    const visible = [...group.querySelectorAll('.artist-card')].some(c => c.style.display !== 'none');
    group.style.display = visible ? '' : 'none';
  });
}

async function load() {
  const res = await fetch('/api/load');
  const json = await res.json();
  const data = json.data || {};

  allArtists = Object.entries(data)
    .filter(([slug]) => slug !== '__rain_plan__')
    .map(([slug, d]) => {
      ['stage','rainStage','checkstage','stage2'].forEach(k => { if (d[k]) d[k] = d[k].replace(/lakeside amphitheate[r|re]*/gi, 'Lakeside').replace(/the lake amphitheate[r|re]*/gi, 'Lakeside'); });
      return { slug, ...d };
    })
    .sort((a, b) => {
      const da = DAY_ORDER[a.setday] ?? 4, db = DAY_ORDER[b.setday] ?? 4;
      if (da !== db) return da - db;
      return parseTime(a.settime) - parseTime(b.settime);
    });

  const total = allArtists.length;
  const ready = allArtists.filter(a => a.setday && a.settime).length;
  document.getElementById('stats').textContent = `${total} artists · ${ready} with set times · ${total - ready} pending`;

  const groups = {};
  allArtists.forEach(a => {
    const day = a.setday || 'No set time yet';
    if (!groups[day]) groups[day] = [];
    groups[day].push(a);
  });

  const dayOrder = ['Thursday', 'Friday', 'Saturday', 'Sunday', 'No set time yet'];
  const html = dayOrder
    .filter(d => groups[d])
    .map(day => {
      const cards = groups[day].map(a => {
        const hasSet = a.setday && a.settime;
        const set1 = hasSet ? `${a.settime} · ${a.stage || '—'}` : '';
        const set2 = a.setday2 && a.settime2 ? `${a.settime2} · ${a.stage2 || '—'}` : '';
        const setInfo = hasSet
          ? [set1, set2].filter(Boolean).join('<span style="color:var(--rule);margin:0 6px">|</span>')
          : '<em style="color:var(--muted)">Set time TBC</em>';
        const tags = [
          lodgingTag(a),
          a.photographer ? `<span class="card-tag">📸 ${a.photographer}</span>` : '',
          a.stagemgr ? `<span class="card-tag">SM: ${a.stagemgr}</span>` : '',
        ].filter(Boolean).join('');

        const notes = a.artistCareNotes || '';
        return `<div class="artist-card${hasSet ? '' : ' no-set'}" data-name="${a.name}">
          <a class="card-main" href="/?artist=${a.slug}" target="_blank">
            <div class="card-top">
              <div class="card-name">${a.name}</div>
              <div class="card-set">${setInfo}</div>
            </div>
            ${tags ? `<div class="card-meta">${tags}</div>` : ''}
            ${notes ? `<div class="card-notes">${notes}</div>` : ''}
          </a>
          <div class="card-actions">
            <a class="action-btn" href="/?artist=${a.slug}" target="_blank">Page ↗</a>
            <a class="action-btn print" href="/print.html?artist=${a.slug}" target="_blank">Print ⬇</a>
          </div>
        </div>`;
      }).join('');
      return `<div class="day-group"><div class="day-label">${day}</div>${cards}</div>`;
    }).join('');

  document.getElementById('roster').innerHTML = html;
}

load();
</script>
